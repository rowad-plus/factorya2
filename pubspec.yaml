name: factorya
description: فاكتوريا - دليل المصانع الصناعي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  go_router: ^13.2.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.0.7
  geolocator: ^12.0.0
  record: ^6.0.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  flutter_cache_manager: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/locales/
